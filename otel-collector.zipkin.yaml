receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/redact_prompts:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - 'replace_pattern(log.attributes["prompt"], "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")'
    trace_statements:
      - context: spanevent
        statements:
          - 'replace_pattern(spanevent.attributes["prompt"], "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")'
  batch:

exporters:
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans
    format: json
  nop:

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/redact_prompts, batch]
      exporters: [nop]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [nop]
    traces:
      receivers: [otlp]
      processors: [transform/redact_prompts, batch]
      exporters: [zipkin]
