receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/redact_prompts:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - 'replace_pattern(log.attributes["prompt"], "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")'
    trace_statements:
      - context: spanevent
        statements:
          - 'replace_pattern(spanevent.attributes["prompt"], "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")'
  batch:

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  nop:

service:
  pipelines:
    # Jaeger is traces-first; accept logs/metrics so Codex does not error, then drop them.
    logs:
      receivers: [otlp]
      processors: [transform/redact_prompts, batch]
      exporters: [nop]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [nop]
    traces:
      receivers: [otlp]
      processors: [transform/redact_prompts, batch]
      exporters: [otlp/jaeger]
